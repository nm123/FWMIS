name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.13'

jobs:
  # Quality Assurance Job
  quality:
    name: Code Quality & Security
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements_optimized.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_optimized.txt
        pip install pytest pytest-cov black isort flake8 bandit safety mypy

    - name: Run security audit
      run: |
        safety check --full-report
        bandit -r scripts/ -f json -o security-report.json || true

    - name: Code formatting check (Black)
      run: |
        black --check --diff scripts/ tests/

    - name: Import sorting check (isort)
      run: |
        isort --check-only --diff scripts/ tests/

    - name: Linting (flake8)
      run: |
        flake8 scripts/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 scripts/ tests/ --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Type checking (mypy)
      run: |
        mypy scripts/ --ignore-missing-imports --no-strict-optional || true

    - name: Upload security report
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: security-report
        path: security-report.json

  # Testing Job
  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: quality
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache pip dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('**/requirements_optimized.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-${{ matrix.python-version }}-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_optimized.txt
        pip install pytest pytest-cov pytest-xdist pytest-benchmark

    - name: Create test database
      run: |
        mkdir -p data
        sqlite3 data/test.db ".read scripts/schema.sql" || true

    - name: Run unit tests
      run: |
        python -m pytest tests/unit/ -v --cov=scripts --cov-report=xml --cov-report=term-missing --cov-fail-under=75

    - name: Run integration tests
      run: |
        python -m pytest tests/integration/ -v --cov=scripts --cov-report=xml --cov-append --cov-fail-under=75
      continue-on-error: true  # Integration tests might be more fragile

    - name: Run performance tests
      run: |
        python -m pytest tests/unit/test_case_repository.py::TestCaseRepository::test_search_cases -v --benchmark-only --benchmark-json=benchmark.json
      continue-on-error: true

    - name: Upload coverage reports
      uses: actions/upload-artifact@v3
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: coverage.xml

    - name: Upload benchmark results
      uses: actions/upload-artifact@v3
      if: always()
      with:
        name: benchmark-results
        path: benchmark.json

  # Build & Package Job
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    needs: [quality, test]
    if: github.ref == 'refs/heads/main'

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install -r requirements_optimized.txt

    - name: Build executable
      run: |
        pyinstaller --onefile --windowed --name=fwmis scripts/fw_management.py

    - name: Create release archive
      run: |
        zip -r fwmis-${{ github.sha }}.zip dist/ scripts/ requirements_optimized.txt README.md

    - name: Upload build artifacts
      uses: actions/upload-artifact@v3
      with:
        name: fwmis-build
        path: |
          dist/
          fwmis-${{ github.sha }}.zip

  # Deploy Job (for future use)
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [quality, test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Download build artifacts
      uses: actions/download-artifact@v5
      with:
        name: fwmis-build

    - name: Deploy to staging
      run: |
        echo "Deployment would happen here"
        echo "Copy files to staging server"
        echo "Run database migrations"
        echo "Update application configuration"
      # Note: Actual deployment steps would depend on your infrastructure

  # Notification Job
  notify:
    name: Notifications
    runs-on: ubuntu-latest
    needs: [quality, test, build]
    if: always()

    steps:
    - name: Send notification on failure
      if: failure()
      run: |
        echo "Pipeline failed - sending notification"
        # Add notification logic here (Slack, email, etc.)

    - name: Send notification on success
      if: success()
      run: |
        echo "Pipeline succeeded - sending notification"
        # Add notification logic here

  # Documentation Job
  docs:
    name: Generate Documentation
    runs-on: ubuntu-latest
    needs: quality

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install documentation dependencies
      run: |
        pip install pdoc3 sphinx

    - name: Generate API documentation
      run: |
        pdoc --html --output-dir docs/api scripts/

    - name: Upload documentation
      uses: actions/upload-artifact@v3
      with:
        name: documentation
        path: docs/
