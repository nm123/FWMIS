name: FWMIS Automated Testing

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'

jobs:
  test:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_optimized.txt
        pip install pytest pytest-benchmark

    - name: Create test database
      run: |
        # Copy production database for testing
        if (Test-Path "data\fruitless.db") {
          Copy-Item "data\fruitless.db" "data\fruitless_test.db"
        }

    - name: Generate test data
      run: |
        python test_data_generator.py --cases 50 --bas-files 2 --evidence 5

    - name: Run unit tests
      run: |
        python -m pytest test_automated_suite.py -v --tb=short

    - name: Run performance tests
      run: |
        python -m pytest test_automated_suite.py::TestPerformance -v --benchmark-only

    - name: Run import simulation
      run: |
        python test_runner.py --simulate-import

    - name: Generate test report
      run: |
        python test_runner.py --generate-report

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          test_report.html
          .pytest_cache/
          *.log

  integration-test:
    runs-on: windows-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_optimized.txt

    - name: Run integration tests
      run: |
        python test_runner.py --workflow-only

    - name: Run full workflow test
      run: |
        python -m pytest test_automated_suite.py::TestFWMISWorkflow::test_full_case_workflow -v

  performance-test:
    runs-on: windows-latest
    needs: test

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements_optimized.txt
        pip install pytest-benchmark

    - name: Generate performance data
      run: |
        python test_data_generator.py --performance medium

    - name: Run performance benchmarks
      run: |
        python -m pytest test_automated_suite.py::TestPerformance -v --benchmark-json=perf_results.json

    - name: Upload performance results
      uses: actions/upload-artifact@v4
      with:
        name: performance-results
        path: perf_results.json
